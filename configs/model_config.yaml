# Hyperparameters per model. Defaults chosen for fast, reproducible
# training; not extensively tuned. See PROCESS.md for tuning notes.

demand:
  baseline_naive_lag: 7        # last-week same-DOW value
  baseline_rolling_window: 28  # 4-week rolling mean

  hgb:
    learning_rate: 0.05
    max_depth: 8
    max_iter: 400
    min_samples_leaf: 50
    l2_regularization: 0.0
    early_stopping: true
    validation_fraction: 0.1   # internal, time-aware split is applied at the dataset level
    random_state: 42

cash:
  baseline_lag: 7
  hgb:
    learning_rate: 0.05
    max_depth: 7
    max_iter: 400
    min_samples_leaf: 40
    l2_regularization: 0.0
    early_stopping: true
    validation_fraction: 0.1
    random_state: 42
