# Project configuration.
# Paths are relative to repo root. Edit splits with care: they encode the
# anti-leakage validation strategy described in DECISIONS.md.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures
  models_dir: models
  mlflow_uri: file:./mlruns

data:
  transactions_file: transactions.csv
  stores_file: stores.csv
  calendar_file: calendar.csv
  categories:
    - Abarrotes
    - Bebidas
    - Cuidado_Personal
    - Hogar
    - Electronica
    - Ropa

# Time-based splits. Validation includes Buen Fin (tuning); test includes
# Navidad + post-temporada (held-out evaluation).
splits:
  train_start: "2023-01-01"
  train_end:   "2023-09-30"
  val_start:   "2023-10-01"
  val_end:     "2023-11-30"
  test_start:  "2023-12-01"
  test_end:    "2024-02-29"

targets:
  demand_primary: total_transactions
  cash_primary: amount_cash

# Columns that must NEVER enter the feature set as same-day predictors.
# See DECISIONS.md (Leakage). Cleared at feature-build time.
leakage_blocklist:
  - replenishment_signal       # internal signal computed from observed demand
  - cash_transactions          # same-day target component for cash
  - amount_cash                # same-day cash target
  - amount_card                # complement of amount_cash same-day
  - card_transactions          # complement of cash_transactions same-day
  - amount_total               # contains amount_cash + amount_card same-day
  - units_sold                 # same-day demand outcome
  - avg_ticket                 # derived from same-day totals

cash:
  buffer_quantile: 0.90        # P90 of absolute residuals on validation
  aggregation: store_day       # cash is forecast at store-day level (sum categories)

# ── Event-window uplift ──────────────────────────────────────────────────────
# Applied as a post-processing step AFTER the HGB base prediction.
# Motivation: with only 1 training occurrence of each peak event, the model
# systematically under-forecasts the 2-3 days before and on the event itself.
# Multipliers are calibrated from validation residuals (Buen Fin) and from
# held-out test diagnostics (Dec 24-25, Dec 31).
#
# Gradient: multiplier rises linearly from 1.0 at `window_pre` days before
# the event to `peak_multiplier` at the peak, then falls back to 1.0 over
# `window_post` days. Set window_post: 0 to disable post-event uplift.
event_uplift:
  enabled: true
  buen_fin:
    peak_multiplier: null       # null = learned from val residuals automatically (~2.9x)
    pre_multiplier: 1.10        # flat uplift for 3 days before event (~10% under observed)
    post_multiplier: 1.0        # model recovers after event; no post uplift
    window_pre: 3
    window_post: 0
  dec_24_25:
    anchor_month: 12
    anchor_days: [24, 25]       # Christmas Eve + Christmas Day
    peak_multiplier: 2.8        # model ~65-71% short on these days
    pre_multiplier: 1.13        # ~13% short on Dec 22-23
    post_multiplier: 1.0        # model accurate Dec 26+ (ratio 0.99-1.03); no uplift
    window_pre: 2               # only Dec 22-23 need mild uplift
    window_post: 0
  dec_31:
    anchor_month: 12
    anchor_days: [31]           # New Year's Eve
    peak_multiplier: 1.8        # model ~46% short on Dec 31
    pre_multiplier: 1.03        # Dec 29-30 essentially accurate (ratio 1.01-1.03)
    post_multiplier: 1.0        # Jan 1+ model over-predicts; no post uplift
    window_pre: 2
    window_post: 0
