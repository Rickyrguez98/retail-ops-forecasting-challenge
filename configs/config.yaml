# Project configuration.
# Paths are relative to repo root. Edit splits with care: they encode the
# anti-leakage validation strategy described in DECISIONS.md.

seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures
  models_dir: models
  mlflow_uri: file:./mlruns

data:
  transactions_file: transactions.csv
  stores_file: stores.csv
  calendar_file: calendar.csv
  categories:
    - Abarrotes
    - Bebidas
    - Cuidado_Personal
    - Hogar
    - Electronica
    - Ropa

# Time-based splits. Validation includes Buen Fin (tuning); test includes
# Navidad + post-temporada (held-out evaluation).
splits:
  train_start: "2023-01-01"
  train_end:   "2023-09-30"
  val_start:   "2023-10-01"
  val_end:     "2023-11-30"
  test_start:  "2023-12-01"
  test_end:    "2024-02-29"

targets:
  demand_primary: total_transactions
  cash_primary: amount_cash

# Columns that must NEVER enter the feature set as same-day predictors.
# See DECISIONS.md (Leakage). Cleared at feature-build time.
leakage_blocklist:
  - replenishment_signal       # internal signal computed from observed demand
  - cash_transactions          # same-day target component for cash
  - amount_cash                # same-day cash target
  - amount_card                # complement of amount_cash same-day
  - card_transactions          # complement of cash_transactions same-day
  - amount_total               # contains amount_cash + amount_card same-day
  - units_sold                 # same-day demand outcome
  - avg_ticket                 # derived from same-day totals

cash:
  buffer_quantile: 0.90        # P90 of absolute residuals on validation
  aggregation: store_day       # cash is forecast at store-day level (sum categories)

# ── Event-window stress adjustment (POST-HOC, business-rule layer) ──────────
# IMPORTANT — methodological scope:
#   This block is a POST-HOC operational stress adjustment, NOT part of the
#   clean holdout model. Reported "official" model performance MUST come from
#   the base model evaluated on test without this adjustment applied
#   (see reports/final_report.md §4.1.A "Clean holdout performance").
#
# Why this layer exists:
#   The training window (2023-01 → 2023-09) contains exactly ONE occurrence
#   of each Mexican retail peak event (Buen Fin = Nov; Christmas Eve/Day;
#   New Year's Eve). With n=1 historical occurrence, a tree-based learner
#   cannot reliably extrapolate the peak magnitude and systematically
#   under-forecasts these dates. The retail industry knows ex-ante that
#   demand and cash spike 1.5×–3× on these days; this adjustment encodes
#   that domain knowledge as a business rule on top of the base prediction.
#
# Calibration policy (read carefully):
#   - buen_fin: peak_multiplier is learned from the validation residuals
#     (val = 2023-10 → 2023-11 explicitly includes Buen Fin for tuning).
#     This is a legitimate val-tuned parameter.
#   - dec_24_25, dec_31: the magnitudes are business-rule defaults grounded
#     in published Mexican retail seasonality (e.g. ANTAD/INEGI commentary
#     for the Dec 24-25 and Dec 31 peaks). They are NOT tuned against the
#     test residuals. In a production setting they should be re-calibrated
#     from MULTIPLE prior years of comparable events — not from the final
#     test window — before being trusted operationally.
#
# Reporting policy: every report file MUST present
#   (A) Clean holdout performance (base model on test, no adjustment)
#   (B) Post-hoc stress scenario (base + adjustment on test)
# as two SEPARATE rows/tables. The clean holdout is the "official" metric.
#
# Gradient: multiplier rises linearly from 1.0 at `window_pre` days before
# the event to `peak_multiplier` at the peak, then falls back to 1.0 over
# `window_post` days. Set window_post: 0 to disable post-event uplift.
# Set enabled: false to evaluate the clean base model only.
event_uplift:
  enabled: true
  buen_fin:
    # Val-tuned: validation window includes Buen Fin by design.
    peak_multiplier: null       # null = learned from val residuals (~2.9x)
    pre_multiplier: 1.10        # mild lift for 3 days before; val residuals
    post_multiplier: 1.0        # base recovers post-event; no lift needed
    window_pre: 3
    window_post: 0
  dec_24_25:
    # Business-rule default — NOT tuned on test. Validate with prior years
    # before production. Magnitude reflects the well-documented Mexican
    # retail Christmas peak (sector commentary: 1.5×–3× regular demand).
    anchor_month: 12
    anchor_days: [24, 25]
    peak_multiplier: 2.8        # business rule for Christmas Eve / Day
    pre_multiplier: 1.13        # mild lift for Dec 22-23
    post_multiplier: 1.0
    window_pre: 2
    window_post: 0
  dec_31:
    # Business-rule default — same caveat as dec_24_25.
    anchor_month: 12
    anchor_days: [31]
    peak_multiplier: 1.8        # business rule for New Year's Eve
    pre_multiplier: 1.03
    post_multiplier: 1.0
    window_pre: 2
    window_post: 0
