[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-ops-forecasting"
version = "0.1.0"
description = "Demand and cash forecasting for Mexican retail operations (Walmart Senior DS challenge)."
readme = "README.md"
# The codebase deliberately avoids Python 3.10+ syntax so it runs on
# 3.9 environments (some macOS users have a working lightgbm/libomp
# stack only on miniforge 3.9). CI and the production Dockerfile use
# Python 3.11 — that is the primary target.
requires-python = ">=3.9"
authors = [{ name = "Candidate" }]
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
# Lowest supported runtime is py39; CI / Docker run on py311.
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["retail_ops_forecasting"]

[tool.ruff]
line-length = 100
# Match black: py39 is the floor so ruff doesn't try to autofix to
# syntax that breaks on the lowest supported interpreter.
target-version = "py39"
extend-exclude = ["notebooks", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# E501: line length handled by black.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["retail_ops_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
